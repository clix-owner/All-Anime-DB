name: Fetch Anime Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: anime-database-fetch
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Every 3 days gate
        id: check
        shell: bash
        run: |
          DAY=$(( $(date -u +%s) / 86400 ))
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || (( DAY % 3 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a scheduled 3-day build day."
          fi

  fetch-part-1:
    needs: cadence
    if: needs.cadence.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore resumable fetch cache
        uses: actions/cache/restore@v4
        with:
          path: |
            checkpoint_anime.json
            mal_season_cache.json
            anilist_lookup_cache.json
            mal_detail_cache.json
          key: anime-fetch-v4-start-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            anime-fetch-v4-part-4-
            anime-fetch-v4-part-3-
            anime-fetch-v4-part-2-
            anime-fetch-v4-part-1-
            anime-fetch-v4-start-
      - name: Fetch anime data (first 4h 50m)
        continue-on-error: true
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: timeout --signal=TERM --kill-after=30s 290m python -u fetch_anime_complete_mal.py
      - name: Save part 1 checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            checkpoint_anime.json
            anime_all_complete.json
            mal_season_cache.json
            anilist_lookup_cache.json
            mal_detail_cache.json
          key: anime-fetch-v4-part-1-${{ github.run_id }}-${{ github.run_attempt }}

  fetch-part-2:
    needs: [cadence, fetch-part-1]
    if: needs.cadence.outputs.run == 'true' && always() && needs.fetch-part-1.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore part 1 checkpoint
        id: restore-part-1
        uses: actions/cache/restore@v4
        with:
          path: |
            checkpoint_anime.json
            anime_all_complete.json
            mal_season_cache.json
            anilist_lookup_cache.json
            mal_detail_cache.json
          key: anime-fetch-v4-part-1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            anime-fetch-v4-part-2-
            anime-fetch-v4-part-1-
      - name: Fetch anime data (second 4h 50m)
        continue-on-error: true
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        shell: bash
        run: |
          if [[ "${{ steps.restore-part-1.outputs.cache-hit }}" == "true" && \
                ! -f checkpoint_anime.json && \
                -f anime_all_complete.json ]]; then
            echo "Part 1 already completed the full database; skipping duplicate fetch."
          else
            timeout --signal=TERM --kill-after=30s 290m python -u fetch_anime_complete_mal.py
          fi
      - name: Save part 2 checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            checkpoint_anime.json
            anime_all_complete.json
            mal_season_cache.json
            anilist_lookup_cache.json
            mal_detail_cache.json
          key: anime-fetch-v4-part-2-${{ github.run_id }}-${{ github.run_attempt }}

  fetch-part-3:
    needs: [cadence, fetch-part-2]
    if: needs.cadence.outputs.run == 'true' && always() && needs.fetch-part-2.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore part 2 checkpoint
        id: restore-part-2
        uses: actions/cache/restore@v4
        with:
          path: |
            checkpoint_anime.json
            anime_all_complete.json
            mal_season_cache.json
            anilist_lookup_cache.json
            mal_detail_cache.json
          key: anime-fetch-v4-part-2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            anime-fetch-v4-part-4-
            anime-fetch-v4-part-3-
            anime-fetch-v4-part-2-
      - name: Fetch anime data (third 4h 50m)
        continue-on-error: true
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        shell: bash
        run: |
          if [[ "${{ steps.restore-part-2.outputs.cache-hit }}" == "true" && \
                ! -f checkpoint_anime.json && \
                -f anime_all_complete.json ]]; then
            echo "Part 2 already completed the full database; skipping duplicate fetch."
          else
            timeout --signal=TERM --kill-after=30s 290m python -u fetch_anime_complete_mal.py
          fi
      - name: Save part 3 checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            checkpoint_anime.json
            anime_all_complete.json
            mal_season_cache.json
            anilist_lookup_cache.json
            mal_detail_cache.json
          key: anime-fetch-v4-part-3-${{ github.run_id }}-${{ github.run_attempt }}

  fetch-part-4:
    needs: [cadence, fetch-part-3]
    if: needs.cadence.outputs.run == 'true' && always() && needs.fetch-part-3.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore part 3 checkpoint
        id: restore-part-3
        uses: actions/cache/restore@v4
        with:
          path: |
            checkpoint_anime.json
            anime_all_complete.json
            mal_season_cache.json
            anilist_lookup_cache.json
            mal_detail_cache.json
          key: anime-fetch-v4-part-3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            anime-fetch-v4-part-4-
            anime-fetch-v4-part-3-
      - name: Fetch anime data (fourth 4h 50m)
        continue-on-error: true
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        shell: bash
        run: |
          if [[ "${{ steps.restore-part-3.outputs.cache-hit }}" == "true" && \
                ! -f checkpoint_anime.json && \
                -f anime_all_complete.json ]]; then
            echo "Part 3 already completed the full database; skipping duplicate fetch."
          else
            timeout --signal=TERM --kill-after=30s 290m python -u fetch_anime_complete_mal.py
          fi
      - name: Save final resumable fetch cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            checkpoint_anime.json
            mal_season_cache.json
            anilist_lookup_cache.json
            mal_detail_cache.json
          key: anime-fetch-v4-part-4-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Detect anime_all_complete.json change
        id: source-change
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f anime_all_complete.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated anime_all_complete.json."
            exit 0
          fi

          git fetch origin main

          OLD_FILE="$RUNNER_TEMP/origin-anime_all_complete.json"
          if git show origin/main:anime_all_complete.json > "$OLD_FILE" 2>/dev/null; then
            if cmp -s anime_all_complete.json "$OLD_FILE"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "anime_all_complete.json is unchanged."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "anime_all_complete.json changed."
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "anime_all_complete.json is new."
          fi

      - name: Commit generated JSON
        if: always()
        shell: bash
        run: |
          if [ ! -f anime_all_complete.json ]; then
            echo "No completed database output to publish."
            exit 0
          fi

          SOURCE_JSON="$PWD/anime_all_complete.json"

          # A long fetch can finish after new commits have reached main. Build
          # the publishing commit on the latest origin/main in a clean
          # worktree, so the generated JSON never causes a non-fast-forward
          # push merely because the checkout is old. Retry the tiny
          # fetch/copy/commit/push window if main moves again concurrently.
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            PUBLISH_DIR="$RUNNER_TEMP/anime-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ATTEMPT}"
            git worktree add --detach "$PUBLISH_DIR" origin/main
            cp "$SOURCE_JSON" "$PUBLISH_DIR/anime_all_complete.json"

            if (
              cd "$PUBLISH_DIR"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add anime_all_complete.json
              if git diff --cached --quiet; then
                echo "No database changes to commit."
                exit 0
              fi
              git commit -m "chore: update anime database"
              git push origin HEAD:main
            ); then
              echo "Database published from latest origin/main."
              exit 0
            fi

            echo "main moved during publish attempt ${ATTEMPT}; retrying on the new tip."
          done

          echo "Failed to publish after 3 fresh latest-main attempts."
          exit 1

      - name: Trigger merge workflow when source changed
        if: steps.source-change.outputs.changed == 'true'
        env:
          MERGE_REPO: ${{ vars.MERGE_REPO || secrets.MERGE_REPO }}
          MERGE_DISPATCH_TOKEN: ${{ secrets.MERGE_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${MERGE_REPO:-}" || { echo "::error::Missing MERGE_REPO variable/secret (owner/repo)"; exit 1; }
          test -n "${MERGE_DISPATCH_TOKEN:-}" || { echo "::error::Missing MERGE_DISPATCH_TOKEN secret"; exit 1; }

          echo "Triggering merge workflow in ${MERGE_REPO}"
          curl --fail-with-body --silent --show-error             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer ${MERGE_DISPATCH_TOKEN}"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${MERGE_REPO}/dispatches"             --data '{"event_type":"anime-sources-updated","client_payload":{"source":"anime_all_complete.json"}}'

      - name: Publish JSON to public repository
        if: always()
        env:
          TARGET_REPO: ${{ vars.PUBLIC_DATA_REPO }}
          TARGET_BRANCH: ${{ vars.PUBLIC_DATA_BRANCH || 'main' }}
          TARGET_PATH: ${{ vars.PUBLIC_DATA_PATH || 'anime_all_complete.json' }}
          PUBLIC_DATA_TOKEN: ${{ secrets.PUBLIC_DATA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f anime_all_complete.json ]; then
            echo "anime_all_complete.json does not exist; nothing to publish."
            exit 0
          fi

          if [ -z "${TARGET_REPO:-}" ]; then
            echo "Missing repository variable: PUBLIC_DATA_REPO (example: owner/public-data-repo)"
            exit 1
          fi

          if [ -z "${PUBLIC_DATA_TOKEN:-}" ]; then
            echo "Missing Actions secret: PUBLIC_DATA_TOKEN"
            exit 1
          fi

          SOURCE_JSON="$PWD/anime_all_complete.json"
          python -m json.tool "$SOURCE_JSON" >/dev/null

          TARGET_DIR="$RUNNER_TEMP/public-anime-data"
          rm -rf "$TARGET_DIR"

          # Clone using the PAT. The token is masked by GitHub Actions.
          git clone \
            --branch "$TARGET_BRANCH" \
            --single-branch \
            "https://x-access-token:${PUBLIC_DATA_TOKEN}@github.com/${TARGET_REPO}.git" \
            "$TARGET_DIR"

          cd "$TARGET_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only TARGET_PATH is managed by this workflow.
          # Other files in the shared public repo are never removed or staged.
          for ATTEMPT in 1 2 3; do
            echo "Public publish attempt ${ATTEMPT}/3"

            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            mkdir -p "$(dirname "$TARGET_PATH")"
            cp "$SOURCE_JSON" "$TARGET_PATH"

            git add -- "$TARGET_PATH"

            if git diff --cached --quiet; then
              echo "No public JSON changes to publish."
              exit 0
            fi

            git commit -m "chore: update ${TARGET_PATH}"

            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Published ${TARGET_PATH} to ${TARGET_REPO}@${TARGET_BRANCH}"
              exit 0
            fi

            echo "Target branch moved during push; retrying from latest remote state."
          done

          echo "Failed to publish after 3 attempts."
          exit 1

